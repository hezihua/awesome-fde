  <text x="105" y="455" fill="#D94F2F" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="43" font-weight="900">👉 先看这 4 件事能不能交付</text>

  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="96" y="558" fill="#E87528" font-size="32" font-weight="900">1. 业务问题说清楚了吗？</text>
    <text x="110" y="606" fill="#333B3C" font-size="25">具体要改善哪个环节？谁在什么场景里用？</text>
    <path d="M96 626 H925" stroke="#F0E6CF" stroke-width="2"/>

    <text x="96" y="692" fill="#E87528" font-size="32" font-weight="900">2. 流程真的跑通了吗？</text>
    <text x="110" y="740" fill="#333B3C" font-size="25">资料、工具、人工检查，前后能接得上吗？</text>
    <path d="M96 760 H925" stroke="#F0E6CF" stroke-width="2"/>

    <text x="96" y="826" fill="#E87528" font-size="32" font-weight="900">3. 结果有验收标准吗？</text>
    <text x="110" y="874" fill="#333B3C" font-size="25">先约定什么叫“能用”，再开始做 Demo。</text>
    <path d="M96 894 H925" stroke="#F0E6CF" stroke-width="2"/>

    <text x="96" y="960" fill="#E87528" font-size="32" font-weight="900">4. 团队能接手继续用吗？</text>
    <text x="110" y="1008" fill="#333B3C" font-size="25">有操作说明、权限边界和问题处理办法吗？</text>
  </g>

  <rect x="92" y="1064" width="565" height="176" rx="24" fill="#FFF4D2"/>
  <text x="120" y="1124" fill="#283536" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="800">FDE 的价值</text>
  <text x="120" y="1175" fill="#283536" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24">懂业务、能动手、能把方案</text>
  <text x="120" y="1215" fill="#D65331" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="900">交付到客户团队手里。</text>

