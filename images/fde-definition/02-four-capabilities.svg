<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <rect width="1080" height="1440" fill="#FFFDF6"/><rect x="26" y="26" width="1028" height="1388" rx="40" fill="#FFF0B8" stroke="#F1D986" stroke-width="3"/><rect x="58" y="58" width="964" height="1324" rx="34" fill="#FFFEFA" stroke="#E9C95F" stroke-width="3"/>
  <g fill="#F6B95F"><circle cx="118" cy="101" r="12"/><circle cx="184" cy="101" r="12"/><circle cx="250" cy="101" r="12"/><circle cx="316" cy="101" r="12"/><circle cx="382" cy="101" r="12"/><circle cx="448" cy="101" r="12"/><circle cx="514" cy="101" r="12"/><circle cx="580" cy="101" r="12"/><circle cx="646" cy="101" r="12"/><circle cx="712" cy="101" r="12"/><circle cx="778" cy="101" r="12"/><circle cx="844" cy="101" r="12"/><circle cx="910" cy="101" r="12"/><circle cx="976" cy="101" r="12"/></g>
  <text x="96" y="178" fill="#263238" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700">FDE 能力模型 · 四个环节</text><text x="94" y="278" fill="#E85D35" font-family="Microsoft YaHei, sans-serif" font-size="52" font-weight="900">懂业务，也要能落地</text><text x="98" y="333" fill="#68706D" font-family="Microsoft YaHei, sans-serif" font-size="25">四项能力串起来，才是完整的交付链。</text>
  <g font-family="Microsoft YaHei, sans-serif">
   <rect x="92" y="390" width="896" height="170" rx="24" fill="#FFF4D2"/><circle cx="154" cy="475" r="37" fill="#E87528"/><text x="154" y="487" text-anchor="middle" fill="#fff" font-size="31" font-weight="900">1</text><text x="220" y="456" fill="#D65331" font-size="31" font-weight="900">顾问诊断</text><text x="220" y="508" fill="#333B3C" font-size="25">看懂业务卡点，把需求问准。</text>
   <rect x="92" y="583" width="896" height="170" rx="24" fill="#FCE8D7"/><circle cx="154" cy="668" r="37" fill="#E87528"/><text x="154" y="680" text-anchor="middle" fill="#fff" font-size="31" font-weight="900">2</text><text x="220" y="649" fill="#D65331" font-size="31" font-weight="900">销售沟通</text><text x="220" y="701" fill="#333B3C" font-size="25">讲清方案价值，推动项目落地。</text>
   <rect x="92" y="776" width="896" height="170" rx="24" fill="#E8F0E5"/><circle cx="154" cy="861" r="37" fill="#547A63"/><text x="154" y="873" text-anchor="middle" fill="#fff" font-size="31" font-weight="900">3</text><text x="220" y="842" fill="#355C48" font-size="31" font-weight="900">工程 + 审美</text><text x="220" y="894" fill="#333B3C" font-size="25">做出贴合场景、解决卡点的工具。</text>
   <rect x="92" y="969" width="896" height="170" rx="24" fill="#E5EDF0"/><circle cx="154" cy="1054" r="37" fill="#477B83"/><text x="154" y="1066" text-anchor="middle" fill="#fff" font-size="31" font-weight="900">4</text><text x="220" y="1035" fill="#35656B" font-size="31" font-weight="900">教学带练</text><text x="220" y="1087" fill="#333B3C" font-size="25">让客户团队会用，逐步自己造血。</text>
  </g>
  <rect x="92" y="1172" width="896" height="110" rx="22" fill="#183B35"/><text x="126" y="1240" fill="#FFFDF6" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="900">顾问看懂病 → 工程让方案起效 → 客户学会用</text>
