<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <rect width="1080" height="1440" fill="#FFFDF6"/><rect x="26" y="26" width="1028" height="1388" rx="40" fill="#FFF0B8" stroke="#F1D986" stroke-width="3"/><rect x="58" y="58" width="964" height="1324" rx="34" fill="#FFFEFA" stroke="#E9C95F" stroke-width="3"/>
  <g fill="#F6B95F"><circle cx="118" cy="101" r="12"/><circle cx="184" cy="101" r="12"/><circle cx="250" cy="101" r="12"/><circle cx="316" cy="101" r="12"/><circle cx="382" cy="101" r="12"/><circle cx="448" cy="101" r="12"/><circle cx="514" cy="101" r="12"/><circle cx="580" cy="101" r="12"/><circle cx="646" cy="101" r="12"/><circle cx="712" cy="101" r="12"/><circle cx="778" cy="101" r="12"/><circle cx="844" cy="101" r="12"/><circle cx="910" cy="101" r="12"/><circle cx="976" cy="101" r="12"/></g>
  <text x="96" y="178" fill="#263238" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700">企业 AI 落地 · 岗位认知</text>
  <text x="94" y="295" fill="#E85D35" font-family="Microsoft YaHei, sans-serif" font-size="64" font-weight="900">FDE 是什么？</text>
  <rect x="84" y="335" width="782" height="78" rx="21" fill="#FFE58A" transform="rotate(-1 84 335)"/><text x="105" y="391" fill="#D94F2F" font-family="Microsoft YaHei, sans-serif" font-size="39" font-weight="900">👉 把 AI 接进业务流程的人</text>
  <rect x="92" y="465" width="896" height="145" rx="24" fill="#FFF4D2"/><text x="126" y="520" fill="#283536" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700">全称：Forward Deployed Engineer</text><text x="126" y="570" fill="#D65331" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="900">前沿部署工程师</text>
  <text x="96" y="687" fill="#E87528" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="900">不是“会用几个 AI 工具”</text><text x="110" y="735" fill="#333B3C" font-family="Microsoft YaHei, sans-serif" font-size="25">而是走近真实业务，把需求变成能运行的方案。</text>
  <path d="M96 766H925" stroke="#F0E6CF" stroke-width="2"/>
  <text x="96" y="829" fill="#E87528" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="900">从业务问题开始</text><text x="110" y="877" fill="#333B3C" font-family="Microsoft YaHei, sans-serif" font-size="25">理解流程、资料、使用者和真正的卡点。</text>
  <path d="M96 908H925" stroke="#F0E6CF" stroke-width="2"/>
  <text x="96" y="971" fill="#E87528" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="900">再把 AI 落到工作里</text><text x="110" y="1019" fill="#333B3C" font-family="Microsoft YaHei, sans-serif" font-size="25">搭工具、接流程、测试效果，并带客户上手。</text>
  <rect x="92" y="1090" width="896" height="168" rx="25" fill="#183B35"/><text x="128" y="1150" fill="#B8D5C0" font-family="Microsoft YaHei, sans-serif" font-size="25">一句话记住</text><text x="128" y="1211" fill="#FFFDF6" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="900">FDE，解决 AI 和业务之间的落地鸿沟。</text>
