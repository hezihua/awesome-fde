<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <rect width="1080" height="1440" fill="#FFFDF6"/><rect x="26" y="26" width="1028" height="1388" rx="40" fill="#FFF0B8" stroke="#F1D986" stroke-width="3"/><rect x="58" y="58" width="964" height="1324" rx="34" fill="#FFFEFA" stroke="#E9C95F" stroke-width="3"/>
  <g fill="#F6B95F"><circle cx="118" cy="101" r="12"/><circle cx="184" cy="101" r="12"/><circle cx="250" cy="101" r="12"/><circle cx="316" cy="101" r="12"/><circle cx="382" cy="101" r="12"/><circle cx="448" cy="101" r="12"/><circle cx="514" cy="101" r="12"/><circle cx="580" cy="101" r="12"/><circle cx="646" cy="101" r="12"/><circle cx="712" cy="101" r="12"/><circle cx="778" cy="101" r="12"/><circle cx="844" cy="101" r="12"/><circle cx="910" cy="101" r="12"/><circle cx="976" cy="101" r="12"/></g>
  <text x="96" y="178" fill="#263238" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700">企业为什么需要 FDE？</text><text x="94" y="278" fill="#E85D35" font-family="Microsoft YaHei, sans-serif" font-size="53" font-weight="900">AI 很强，为什么还落不了地？</text>
  <rect x="92" y="330" width="896" height="157" rx="24" fill="#183B35"/><text x="130" y="393" fill="#B8D5C0" font-family="Microsoft YaHei, sans-serif" font-size="25">企业和 AI 之间，常常隔着几道真实问题</text><text x="130" y="447" fill="#FFFDF6" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="900">业务流程 · 企业资料 · 工具连接 · 团队使用</text>
  <g font-family="Microsoft YaHei, sans-serif">
   <text x="96" y="574" fill="#E87528" font-size="31" font-weight="900">FDE 把这些环节串起来</text>
   <rect x="92" y="615" width="896" height="100" rx="20" fill="#FFF4D2"/><circle cx="145" cy="665" r="25" fill="#E87528"/><text x="145" y="674" text-anchor="middle" fill="white" font-size="23" font-weight="900">1</text><text x="194" y="675" fill="#333B3C" font-size="27">走近业务，听懂真实问题</text>
   <path d="M145 720v25m0 0-9-9m9 9 9-9" stroke="#D8784D" stroke-width="4" fill="none"/>
   <rect x="92" y="755" width="896" height="100" rx="20" fill="#FCE8D7"/><circle cx="145" cy="805" r="25" fill="#E87528"/><text x="145" y="814" text-anchor="middle" fill="white" font-size="23" font-weight="900">2</text><text x="194" y="815" fill="#333B3C" font-size="27">设计适合场景的方案和边界</text>
   <path d="M145 860v25m0 0-9-9m9 9 9-9" stroke="#D8784D" stroke-width="4" fill="none"/>
   <rect x="92" y="895" width="896" height="100" rx="20" fill="#E8F0E5"/><circle cx="145" cy="945" r="25" fill="#547A63"/><text x="145" y="954" text-anchor="middle" fill="white" font-size="23" font-weight="900">3</text><text x="194" y="955" fill="#333B3C" font-size="27">搭建、测试，再根据反馈调整</text>
   <path d="M145 1000v25m0 0-9-9m9 9 9-9" stroke="#D8784D" stroke-width="4" fill="none"/>
   <rect x="92" y="1035" width="896" height="100" rx="20" fill="#E5EDF0"/><circle cx="145" cy="1085" r="25" fill="#477B83"/><text x="145" y="1094" text-anchor="middle" fill="white" font-size="23" font-weight="900">4</text><text x="194" y="1095" fill="#333B3C" font-size="27">带团队上手，完成交接</text>
  </g>
  <rect x="92" y="1173" width="896" height="111" rx="22" fill="#FFE58A"/><text x="126" y="1242" fill="#D65331" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="900">让 AI 不止能演示，而是进入真实工作。</text>
  <text x="968" y="1310" text-anchor="end" fill="#A0A39A" font-family="Microsoft YaHei, sans-serif" font-size="19">3 / 3</text>
</svg>
